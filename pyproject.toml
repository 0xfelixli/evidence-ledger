[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger"
version = "0.1.0"
description = "Evidence-backed npm and PyPI catalog audits, with offline replay"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
readme = "README.md"
authors = [{name = "Felix Research"}]
dependencies = []

[project.urls]
Source = "https://github.com/0xfelixli/evidence-ledger"
Issues = "https://github.com/0xfelixli/evidence-ledger/issues"

[project.scripts]
evidence-ledger = "evidence_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
